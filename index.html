<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartBudget App</title>
    <!-- Chargement de Tailwind CSS pour le design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chargement de React -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [activeTab, setActiveTab] = useState('budget');
            const [theme, setTheme] = useState('light');
            const [isLogged, setIsLogged] = useState(false);

            useEffect(() => {
                if (theme === 'dark') {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [theme]);

            const toggleTheme = () => setTheme(theme === 'light' ? 'dark' : 'light');

            if (!isLogged) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gray-100 dark:bg-gray-900 transition-colors">
                        <div className="bg-white dark:bg-gray-800 p-8 rounded-xl shadow-lg max-w-md w-full m-4">
                            <h1 className="text-3xl font-bold text-center mb-6 text-blue-600 dark:text-blue-400">SmartBudget 💸</h1>
                            <div className="space-y-4">
                                <input type="email" placeholder="Adresse Email" className="w-full p-3 border rounded-lg dark:bg-gray-700 dark:border-gray-600 dark:text-white" />
                                <input type="password" placeholder="Mot de passe" className="w-full p-3 border rounded-lg dark:bg-gray-700 dark:border-gray-600 dark:text-white" />
                                <input type="text" placeholder="Localisation (ex: Paris, FR)" className="w-full p-3 border rounded-lg dark:bg-gray-700 dark:border-gray-600 dark:text-white" />
                                <div className="flex gap-4 dark:text-white">
                                    <label className="flex items-center gap-2"><input type="radio" name="account" defaultChecked /> Compte Individuel</label>
                                    <label className="flex items-center gap-2"><input type="radio" name="account" /> Compte Joint</label>
                                </div>
                                <button onClick={() => setIsLogged(true)} className="w-full bg-blue-600 text-white p-3 rounded-lg font-bold hover:bg-blue-700 transition">
                                    Créer mon compte / Se connecter
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen pb-20 dark:bg-gray-900 dark:text-white transition-colors">
                    {/* Header */}
                    <header className="bg-blue-600 text-white p-4 sticky top-0 z-10 shadow-md">
                        <div className="max-w-4xl mx-auto flex justify-between items-center">
                            <h1 className="text-xl font-bold">SmartBudget 💸</h1>
                            <div className="flex gap-2 items-center text-sm bg-blue-700 px-3 py-1 rounded-full">
                                📍 Viarmes, 95270
                            </div>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="max-w-4xl mx-auto p-4 mt-4">
                        
                        {/* ONGLET BUDGET */}
                        {activeTab === 'budget' && (
                            <div className="space-y-6">
                                <h2 className="text-2xl font-bold flex items-center gap-2">💼 Mon Budget Mensuel</h2>
                                
                                <div className="bg-gradient-to-r from-blue-500 to-blue-700 rounded-xl p-6 text-white shadow-lg">
                                    <p className="text-blue-100">Solde Restant</p>
                                    <h3 className="text-4xl font-bold mt-1">1 240,50 €</h3>
                                    <div className="mt-4 flex flex-wrap gap-2">
                                        <button className="bg-white/20 hover:bg-white/30 px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition">
                                            🏦 Lier BoursoBank
                                        </button>
                                        <button className="bg-white/20 hover:bg-white/30 px-4 py-2 rounded-lg text-sm font-medium transition">
                                            ✏️ Saisie Manuelle
                                        </button>
                                    </div>
                                </div>

                                <div className="bg-white dark:bg-gray-800 rounded-xl p-6 shadow">
                                    <h3 className="font-bold mb-4 flex items-center gap-2">📉 Dernières dépenses</h3>
                                    <ul className="space-y-3">
                                        <li className="flex justify-between items-center border-b dark:border-gray-700 pb-2">
                                            <span>UberEats - McDonald's</span><span className="text-red-500 font-bold">-24.50 €</span>
                                        </li>
                                        <li className="flex justify-between items-center border-b dark:border-gray-700 pb-2">
                                            <span>Courses Lidl</span><span className="text-red-500 font-bold">-56.20 €</span>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        )}

                        {/* ONGLET COURSES */}
                        {activeTab === 'courses' && (
                            <div className="space-y-6">
                                <h2 className="text-2xl font-bold flex items-center gap-2">🛒 Liste de Courses & IA</h2>
                                
                                <div className="bg-white dark:bg-gray-800 rounded-xl p-6 shadow">
                                    <div className="flex gap-4 mb-4 overflow-x-auto pb-2">
                                        <button className="bg-blue-100 text-blue-700 dark:bg-blue-900 dark:text-blue-200 px-4 py-2 rounded-full font-medium whitespace-nowrap">🛒 Lidl (Estimation IA)</button>
                                        <button className="bg-gray-100 dark:bg-gray-700 px-4 py-2 rounded-full font-medium whitespace-nowrap text-gray-700 dark:text-gray-300">🛒 Leclerc</button>
                                        <button className="bg-gray-100 dark:bg-gray-700 px-4 py-2 rounded-full font-medium whitespace-nowrap text-gray-700 dark:text-gray-300">🛒 Carrefour</button>
                                    </div>
                                    
                                    <div className="mb-6 p-4 bg-green-50 dark:bg-green-900/30 rounded-lg border border-green-200 dark:border-green-800">
                                        <p className="text-sm font-bold text-green-700 dark:text-green-400">💡 Estimation IA pour Lidl : ~56,20 €</p>
                                        <p className="text-xs text-green-600 dark:text-green-500 mt-1">Leclerc serait 12% plus cher aujourd'hui selon vos articles.</p>
                                    </div>

                                    <ul className="space-y-2">
                                        <li className="flex justify-between items-center p-3 bg-gray-50 dark:bg-gray-700 rounded-lg">
                                            <span className="flex items-center"><input type="checkbox" className="mr-3 w-4 h-4"/>Lait demi-écrémé (6x1L)</span>
                                            <span className="text-sm text-gray-500 dark:text-gray-400">~5.40 €</span>
                                        </li>
                                        <li className="flex justify-between items-center p-3 bg-gray-50 dark:bg-gray-700 rounded-lg">
                                            <span className="flex items-center"><input type="checkbox" className="mr-3 w-4 h-4"/>Poulet rôti</span>
                                            <span className="text-sm text-gray-500 dark:text-gray-400">~6.50 €</span>
                                        </li>
                                        <li className="flex justify-between items-center p-3 bg-gray-50 dark:bg-gray-700 rounded-lg">
                                            <span className="flex items-center"><input type="checkbox" className="mr-3 w-4 h-4"/>Pâtes Panzani (500g)</span>
                                            <span className="text-sm text-gray-500 dark:text-gray-400">~0.99 €</span>
                                        </li>
                                    </ul>
                                    <button className="w-full mt-4 bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg transition font-medium">+ Ajouter un article</button>
                                </div>
                            </div>
                        )}

                        {/* ONGLET PETITS PLAISIRS */}
                        {activeTab === 'plaisirs' && (
                            <div className="space-y-6">
                                <h2 className="text-2xl font-bold flex items-center gap-2">🍕 Petits Plaisirs Autour de Moi</h2>
                                
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div className="bg-white dark:bg-gray-800 rounded-xl p-4 shadow border-l-4 border-orange-500">
                                        <div className="flex justify-between items-start">
                                            <div>
                                                <h3 className="font-bold text-lg">McDonald's</h3>
                                                <p className="text-sm text-gray-500">À 800m • Fast-Food</p>
                                            </div>
                                            <span className="bg-orange-100 text-orange-700 px-2 py-1 rounded text-xs font-bold animate-pulse">Promo -20% UberEats</span>
                                        </div>
                                        <div className="mt-4 flex gap-2">
                                            <button className="flex-1 bg-gray-100 dark:bg-gray-700 py-2 rounded-lg text-sm font-medium hover:bg-gray-200 transition">Menu sur place</button>
                                            <button className="flex-1 bg-green-500 text-white py-2 rounded-lg text-sm font-medium hover:bg-green-600 transition">Livraison (~24€)</button>
                                        </div>
                                    </div>

                                    <div className="bg-white dark:bg-gray-800 rounded-xl p-4 shadow border-l-4 border-red-500">
                                        <div className="flex justify-between items-start">
                                            <div>
                                                <h3 className="font-bold text-lg">Sushi Shop</h3>
                                                <p className="text-sm text-gray-500">À 1.2km • Japonais</p>
                                            </div>
                                        </div>
                                        <div className="mt-4 flex gap-2">
                                            <button className="flex-1 bg-gray-100 dark:bg-gray-700 py-2 rounded-lg text-sm font-medium hover:bg-gray-200 transition">À emporter</button>
                                            <button className="flex-1 bg-green-500 text-white py-2 rounded-lg text-sm font-medium hover:bg-green-600 transition">Livraison (~32€)</button>
                                        </div>
                                    </div>
                                </div>
                                <p className="text-xs text-center text-gray-500 dark:text-gray-400 mt-4">⚠️ Toute commande effectuée ici sera automatiquement déduite de l'onglet Budget.</p>
                            </div>
                        )}

                        {/* ONGLET REGLAGES */}
                        {activeTab === 'settings' && (
                            <div className="space-y-6">
                                <h2 className="text-2xl font-bold flex items-center gap-2">⚙️ Réglages du Compte</h2>
                                
                                <div className="bg-white dark:bg-gray-800 rounded-xl p-6 shadow space-y-6">
                                    
                                    <div className="flex items-center justify-between border-b dark:border-gray-700 pb-4">
                                        <div className="flex items-center gap-3">
                                            <div className="bg-blue-100 p-3 rounded-full text-blue-600 text-xl">👤</div>
                                            <div>
                                                <p className="font-bold">Mon Profil</p>
                                                <p className="text-sm text-gray-500">Compte Joint</p>
                                            </div>
                                        </div>
                                        <button className="text-blue-600 text-sm font-medium">Modifier</button>
                                    </div>

                                    <div className="flex items-center justify-between border-b dark:border-gray-700 pb-4">
                                        <div className="flex items-center gap-3">
                                            <span className="text-xl">📍</span>
                                            <span>Localisation</span>
                                        </div>
                                        <span className="font-medium text-sm">Viarmes, 95270</span>
                                    </div>

                                    <div className="flex items-center justify-between border-b dark:border-gray-700 pb-4">
                                        <div className="flex items-center gap-3">
                                            <span className="text-xl">{theme === 'light' ? '☀️' : '🌙'}</span>
                                            <span>Thème de l'application</span>
                                        </div>
                                        <button onClick={toggleTheme} className="bg-gray-200 dark:bg-gray-700 px-4 py-2 rounded-lg text-sm font-medium hover:bg-gray-300 transition">
                                            Passer en {theme === 'light' ? 'Sombre' : 'Clair'}
                                        </button>
                                    </div>

                                    <button onClick={() => setIsLogged(false)} className="w-full bg-red-100 text-red-600 py-3 rounded-lg font-bold mt-4 hover:bg-red-200 transition">
                                        Se déconnecter
                                    </button>

                                </div>
                            </div>
                        )}

                    </main>

                    {/* Navigation Bas (Mobile & Desktop) */}
                    <nav className="bg-white dark:bg-gray-800 border-t dark:border-gray-700 fixed bottom-0 w-full p-2">
                        <div className="max-w-4xl mx-auto flex justify-around items-center">
                            <button onClick={() => setActiveTab('budget')} className={`flex flex-col items-center p-2 transition ${activeTab === 'budget' ? 'text-blue-600 scale-110' : 'text-gray-500 hover:text-gray-700'}`}>
                                <span className="text-2xl mb-1">💼</span>
                                <span className="text-xs font-medium">Budget</span>
                            </button>
                            <button onClick={() => setActiveTab('courses')} className={`flex flex-col items-center p-2 transition ${activeTab === 'courses' ? 'text-blue-600 scale-110' : 'text-gray-500 hover:text-gray-700'}`}>
                                <span className="text-2xl mb-1">🛒</span>
                                <span className="text-xs font-medium">Courses</span>
                            </button>
                            <button onClick={() => setActiveTab('plaisirs')} className={`flex flex-col items-center p-2 transition ${activeTab === 'plaisirs' ? 'text-blue-600 scale-110' : 'text-gray-500 hover:text-gray-700'}`}>
                                <span className="text-2xl mb-1">🍕</span>
                                <span className="text-xs font-medium">Plaisirs</span>
                            </button>
                            <button onClick={() => setActiveTab('settings')} className={`flex flex-col items-center p-2 transition ${activeTab === 'settings' ? 'text-blue-600 scale-110' : 'text-gray-500 hover:text-gray-700'}`}>
                                <span className="text-2xl mb-1">⚙️</span>
                                <span className="text-xs font-medium">Réglages</span>
                            </button>
                        </div>
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
