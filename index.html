<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartBudget App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            // États globaux de l'application
            const [activeTab, setActiveTab] = useState('budget');
            const [theme, setTheme] = useState('light');
            const [isLogged, setIsLogged] = useState(false);
            const [location, setLocation] = useState('Viarmes, 95270');
            
            // États pour les courses
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedStore, setSelectedStore] = useState('Lidl');
            
            // Données simulées pour le budget (Inspiration Buddy)
            const categories = [
                { id: 1, name: 'Alimentation', icon: '🍔', color: 'bg-orange-500', total: 450, spent: 320, subs: [{name: 'Supermarché', spent: 250}, {name: 'Resto', spent: 70}] },
                { id: 2, name: 'Logement & Factures', icon: '🏠', color: 'bg-blue-500', total: 800, spent: 800, subs: [{name: 'Loyer', spent: 750}, {name: 'Internet', spent: 50}] },
                { id: 3, name: 'Transports', icon: '🚗', color: 'bg-purple-500', total: 150, spent: 45, subs: [{name: 'Essence', spent: 45}] },
                { id: 4, name: 'Loisirs & Shopping', icon: '🛍️', color: 'bg-pink-500', total: 200, spent: 180, subs: [{name: 'Vêtements', spent: 120}, {name: 'Cinéma', spent: 60}] }
            ];

            // Base de données simulée des aliments avec prix par magasin
            const foodDatabase = [
                { id: 1, name: 'Lait demi-écrémé (6x1L)', nutri: 'A', prices: { Lidl: 5.40, Leclerc: 5.75, Carrefour: 5.99 } },
                { id: 2, name: 'Poulet rôti entier', nutri: 'B', prices: { Lidl: 6.50, Leclerc: 6.20, Carrefour: 6.90 } },
                { id: 3, name: 'Pâtes Coquillettes (500g)', nutri: 'A', prices: { Lidl: 0.89, Leclerc: 0.95, Carrefour: 1.10 } },
                { id: 4, name: 'Pizza Surgelée 4 Fromages', nutri: 'D', prices: { Lidl: 2.50, Leclerc: 2.80, Carrefour: 3.10 } },
                { id: 5, name: 'Chocolat au lait noisettes', nutri: 'E', prices: { Lidl: 1.20, Leclerc: 1.45, Carrefour: 1.55 } },
                { id: 6, name: 'Pommes Gala (1kg)', nutri: 'A', prices: { Lidl: 1.99, Leclerc: 2.10, Carrefour: 2.30 } },
                { id: 7, name: 'Coca-Cola (1.5L)', nutri: 'E', prices: { Lidl: 1.65, Leclerc: 1.59, Carrefour: 1.75 } },
            ];

            // Filtrer les aliments selon la recherche
            const filteredFoods = foodDatabase.filter(food => food.name.toLowerCase().includes(searchQuery.toLowerCase()));
            
            // Calculer le total du panier virtuel
            const currentCartTotal = filteredFoods.reduce((sum, item) => sum + item.prices[selectedStore], 0).toFixed(2);
            
            // Calculs Budget globaux
            const totalBudget = categories.reduce((sum, cat) => sum + cat.total, 0);
            const totalSpent = categories.reduce((sum, cat) => sum + cat.spent, 0);
            const remaining = totalBudget - totalSpent;

            // Gestion du thème
            useEffect(() => {
                if (theme === 'dark') document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [theme]);
            const toggleTheme = () => setTheme(theme === 'light' ? 'dark' : 'light');

            // Fonction pour afficher le Nutri-score avec la bonne couleur
            const renderNutriScore = (letter) => {
                const colors = {
                    'A': 'bg-green-700', 'B': 'bg-green-500', 'C': 'bg-yellow-400', 'D': 'bg-orange-500', 'E': 'bg-red-600'
                };
                return <span className={`text-white text-xs font-bold px-2 py-0.5 rounded ${colors[letter]}`}>Nutri {letter}</span>;
            };

            // Composant pour l'écran verrouillé
            const LockedScreen = ({ title }) => (
                <div className="flex flex-col items-center justify-center py-20 text-center px-4">
                    <div className="text-6xl mb-6">🔒</div>
                    <h2 className="text-2xl font-bold mb-2">Onglet verrouillé</h2>
                    <p className="text-gray-500 dark:text-gray-400 mb-6">Vous devez créer un compte pour utiliser la section {title} et l'IA de comparaison.</p>
                    <button onClick={() => setActiveTab('settings')} className="bg-blue-600 text-white font-bold px-6 py-3 rounded-xl hover:bg-blue-700 transition shadow-lg">
                        Créer un compte maintenant
                    </button>
                </div>
            );

            return (
                <div className="min-h-screen pb-24 dark:bg-gray-900 dark:text-white transition-colors">
                    {/* Header dynamique */}
                    <header className="bg-white dark:bg-gray-800 p-4 sticky top-0 z-10 shadow-sm border-b dark:border-gray-700">
                        <div className="max-w-4xl mx-auto flex justify-between items-center">
                            <h1 className="text-xl font-bold text-blue-600 dark:text-blue-400">SmartBudget</h1>
                            {isLogged && (
                                <div className="flex gap-2 items-center text-xs font-medium text-gray-600 dark:text-gray-300 bg-gray-100 dark:bg-gray-700 px-3 py-1.5 rounded-full">
                                    📍 {location}
                                </div>
                            )}
                        </div>
                    </header>

                    <main className="max-w-4xl mx-auto p-4 mt-2">
                        
                        {/* ONGLET BUDGET (Accessible à tous, style "Buddy") */}
                        {activeTab === 'budget' && (
                            <div className="space-y-6">
                                {/* Résumé Global */}
                                <div className="text-center py-6 bg-white dark:bg-gray-800 rounded-3xl shadow-sm border border-gray-100 dark:border-gray-700">
                                    <p className="text-gray-500 dark:text-gray-400 font-medium mb-1">Reste à dépenser</p>
                                    <h2 className="text-5xl font-extrabold text-gray-800 dark:text-white mb-4">{remaining} €</h2>
                                    <div className="w-full bg-gray-200 dark:bg-gray-700 h-3 rounded-full max-w-xs mx-auto overflow-hidden">
                                        <div className="bg-blue-500 h-3 rounded-full" style={{width: `${(totalSpent/totalBudget)*100}%`}}></div>
                                    </div>
                                    <p className="text-xs text-gray-400 mt-2">{totalSpent}€ dépensés sur {totalBudget}€ budgétés</p>
                                    
                                    <button className="mt-6 bg-blue-600 text-white font-bold py-3 px-8 rounded-full shadow-lg shadow-blue-200 dark:shadow-none hover:bg-blue-700 transition">
                                        + Ajouter une transaction
                                    </button>
                                </div>

                                {/* Liste des Catégories (Paramétrables) */}
                                <div className="space-y-4">
                                    <div className="flex justify-between items-center px-2">
                                        <h3 className="font-bold text-lg">Vos catégories</h3>
                                        <button className="text-blue-600 text-sm font-medium">Gérer</button>
                                    </div>
                                    
                                    {categories.map(cat => (
                                        <div key={cat.id} className="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700">
                                            <div className="flex justify-between items-center mb-3">
                                                <div className="flex items-center gap-3">
                                                    <div className={`w-10 h-10 rounded-full flex items-center justify-center text-xl text-white ${cat.color}`}>
                                                        {cat.icon}
                                                    </div>
                                                    <div>
                                                        <p className="font-bold">{cat.name}</p>
                                                        <p className="text-xs text-gray-500">{cat.total - cat.spent}€ restants</p>
                                                    </div>
                                                </div>
                                                <div className="text-right">
                                                    <p className="font-bold">{cat.spent} €</p>
                                                </div>
                                            </div>
                                            {/* Barre de progression catégorie */}
                                            <div className="w-full bg-gray-100 dark:bg-gray-700 h-2 rounded-full mb-3">
                                                <div className={`h-2 rounded-full ${cat.color}`} style={{width: `${(cat.spent/cat.total)*100}%`}}></div>
                                            </div>
                                            {/* Sous-catégories */}
                                            <div className="flex gap-2 flex-wrap">
                                                {cat.subs.map((sub, idx) => (
                                                    <span key={idx} className="bg-gray-50 dark:bg-gray-700 text-gray-600 dark:text-gray-300 text-xs px-2 py-1 rounded-md border dark:border-gray-600">
                                                        {sub.name}: {sub.spent}€
                                                    </span>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* ONGLET COURSES (Bloqué si non connecté) */}
                        {activeTab === 'courses' && (
                            !isLogged ? <LockedScreen title="Courses & Comparateur IA"/> : (
                            <div className="space-y-6">
                                <h2 className="text-2xl font-bold">🛒 Comparateur Courses IA</h2>
                                
                                {/* Barre de recherche */}
                                <div className="relative">
                                    <input 
                                        type="text" 
                                        placeholder="Rechercher un aliment (ex: Lait, Poulet...)" 
                                        className="w-full p-4 pl-12 rounded-2xl bg-white dark:bg-gray-800 border dark:border-gray-700 shadow-sm focus:ring-2 focus:ring-blue-500 outline-none"
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                    />
                                    <span className="absolute left-4 top-4 text-xl">🔍</span>
                                </div>

                                {/* Sélecteur de magasins cliquables */}
                                <div className="flex gap-3 overflow-x-auto pb-2 -mx-4 px-4 scrollbar-hide">
                                    {['Lidl', 'Leclerc', 'Carrefour'].map(store => (
                                        <button 
                                            key={store}
                                            onClick={() => setSelectedStore(store)}
                                            className={`px-5 py-2.5 rounded-full font-bold whitespace-nowrap transition-all ${selectedStore === store ? 'bg-blue-600 text-white shadow-md scale-105' : 'bg-gray-200 text-gray-700 dark:bg-gray-700 dark:text-gray-300'}`}
                                        >
                                            🏬 {store}
                                        </button>
                                    ))}
                                </div>
                                
                                {/* Résumé IA */}
                                <div className="p-4 bg-gradient-to-r from-green-50 to-emerald-50 dark:from-green-900/40 dark:to-emerald-900/40 rounded-2xl border border-green-200 dark:border-green-800 relative overflow-hidden">
                                    <div className="absolute top-0 right-0 p-2 opacity-10 text-4xl">🤖</div>
                                    <p className="text-sm font-bold text-green-800 dark:text-green-300 mb-1">Analyse IA en direct ⚡</p>
                                    <p className="text-xs text-green-700 dark:text-green-400 leading-relaxed">
                                        Pour les {filteredFoods.length} articles affichés, le total chez <b>{selectedStore}</b> est estimé à <b>{currentCartTotal} €</b>.<br/>
                                        {selectedStore !== 'Lidl' ? "Lidl reste en moyenne 8% moins cher sur cette sélection d'articles." : "C'est actuellement le panier le moins cher parmi vos magasins favoris !"}
                                    </p>
                                </div>

                                {/* Liste des aliments avec Nutri-score */}
                                <div className="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden">
                                    {filteredFoods.length > 0 ? filteredFoods.map((food, index) => (
                                        <div key={food.id} className={`p-4 flex justify-between items-center ${index !== filteredFoods.length -1 ? 'border-b dark:border-gray-700' : ''}`}>
                                            <div className="flex items-center gap-3">
                                                <input type="checkbox" className="w-5 h-5 rounded border-gray-300 text-blue-600 focus:ring-blue-500" />
                                                <div>
                                                    <p className="font-medium text-sm">{food.name}</p>
                                                    <div className="mt-1">{renderNutriScore(food.nutri)}</div>
                                                </div>
                                            </div>
                                            <div className="text-right">
                                                <p className="font-bold text-blue-600 dark:text-blue-400">{food.prices[selectedStore].toFixed(2)} €</p>
                                            </div>
                                        </div>
                                    )) : (
                                        <div className="p-8 text-center text-gray-500">Aucun aliment trouvé.</div>
                                    )}
                                </div>
                            </div>
                            )
                        )}

                        {/* ONGLET PETITS PLAISIRS (Bloqué si non connecté) */}
                        {activeTab === 'plaisirs' && (
                            !isLogged ? <LockedScreen title="Petits Plaisirs"/> : (
                            <div className="space-y-6">
                                <h2 className="text-2xl font-bold flex items-center gap-2">🍕 Restaurants & Promos</h2>
                                <p className="text-sm text-gray-500">Les dépenses ici s'ajoutent automatiquement à la catégorie "Alimentation > Resto".</p>
                                
                                <div className="space-y-4">
                                    <div className="bg-white dark:bg-gray-800 rounded-2xl p-4 shadow-sm border-l-4 border-orange-500">
                                        <div className="flex justify-between items-start mb-3">
                                            <div>
                                                <h3 className="font-bold text-lg">McDonald's</h3>
                                                <p className="text-sm text-gray-500">À 800m • Fast-Food</p>
                                            </div>
                                            <span className="bg-red-100 text-red-700 px-2 py-1 rounded text-xs font-bold animate-pulse">-20% UberEats</span>
                                        </div>
                                        <div className="flex gap-2">
                                            <button className="flex-1 bg-gray-100 dark:bg-gray-700 py-2.5 rounded-xl text-sm font-bold text-gray-700 dark:text-gray-200">Sur place</button>
                                            <button className="flex-1 bg-blue-600 text-white py-2.5 rounded-xl text-sm font-bold">Livraison (~24€)</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            )
                        )}

                        {/* ONGLET REGLAGES (Gère l'inscription, la connexion et le profil) */}
                        {activeTab === 'settings' && (
                            <div className="space-y-6">
                                <h2 className="text-2xl font-bold">⚙️ Réglages & Profil</h2>
                                
                                {!isLogged ? (
                                    // ÉCRAN DE CREATION DE COMPTE
                                    <div className="bg-white dark:bg-gray-800 p-6 rounded-3xl shadow-lg border border-blue-100 dark:border-gray-700">
                                        <h3 className="text-xl font-bold text-center mb-2">Créer un compte</h3>
                                        <p className="text-center text-sm text-gray-500 mb-6">Débloquez les comparatifs IA et vos listes de courses.</p>
                                        
                                        <div className="space-y-4">
                                            <div>
                                                <label className="text-xs font-bold text-gray-500 uppercase">Adresse Email</label>
                                                <input type="email" placeholder="votre@email.com" className="w-full mt-1 p-3 border rounded-xl dark:bg-gray-700 dark:border-gray-600 outline-none focus:border-blue-500" />
                                            </div>
                                            <div>
                                                <label className="text-xs font-bold text-gray-500 uppercase">Mot de passe</label>
                                                <input type="password" placeholder="••••••••" className="w-full mt-1 p-3 border rounded-xl dark:bg-gray-700 dark:border-gray-600 outline-none focus:border-blue-500" />
                                            </div>
                                            <div className="grid grid-cols-2 gap-3 pt-2">
                                                <label className="border dark:border-gray-600 p-3 rounded-xl flex items-center justify-center gap-2 cursor-pointer bg-blue-50 dark:bg-blue-900/20 border-blue-200">
                                                    <input type="radio" name="acc_type" defaultChecked className="accent-blue-600" /> Individuel
                                                </label>
                                                <label className="border dark:border-gray-600 p-3 rounded-xl flex items-center justify-center gap-2 cursor-pointer">
                                                    <input type="radio" name="acc_type" className="accent-blue-600" /> Compte Joint
                                                </label>
                                            </div>
                                            <button onClick={() => setIsLogged(true)} className="w-full bg-blue-600 text-white p-4 rounded-xl font-bold text-lg hover:bg-blue-700 transition mt-4 shadow-lg shadow-blue-200 dark:shadow-none">
                                                S'inscrire / Se connecter
                                            </button>
                                        </div>
                                    </div>
                                ) : (
                                    // ÉCRAN DE REGLAGES CONNECTÉ
                                    <div className="bg-white dark:bg-gray-800 rounded-3xl p-6 shadow-sm border border-gray-100 dark:border-gray-700 space-y-6">
                                        <div className="flex items-center gap-4 border-b dark:border-gray-700 pb-6">
                                            <div className="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center text-3xl">👤</div>
                                            <div>
                                                <p className="font-bold text-xl">Mon Profil</p>
                                                <p className="text-sm text-gray-500">Compte Premium Actif</p>
                                            </div>
                                        </div>

                                        <div className="space-y-5">
                                            <div>
                                                <label className="text-xs font-bold text-gray-500 uppercase flex items-center gap-1 mb-2">📍 Ma Localisation (pour les magasins)</label>
                                                <input 
                                                    type="text" 
                                                    value={location}
                                                    onChange={(e) => setLocation(e.target.value)}
                                                    className="w-full p-3 border rounded-xl dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-blue-500 outline-none font-medium" 
                                                />
                                            </div>

                                            <div className="flex items-center justify-between py-2 border-t dark:border-gray-700">
                                                <div className="font-medium">Apparence ({theme === 'light' ? 'Clair' : 'Sombre'})</div>
                                                <button onClick={toggleTheme} className="bg-gray-200 dark:bg-gray-600 p-2 rounded-lg text-xl">
                                                    {theme === 'light' ? '🌙' : '☀️'}
                                                </button>
                                            </div>

                                            <button onClick={() => setIsLogged(false)} className="w-full bg-red-50 text-red-600 dark:bg-red-900/20 dark:text-red-400 py-4 rounded-xl font-bold mt-4 hover:bg-red-100 transition">
                                                Me déconnecter
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                    </main>

                    {/* Menu de Navigation bas d'écran */}
                    <nav className="bg-white dark:bg-gray-800 border-t dark:border-gray-700 fixed bottom-0 w-full pb-safe pt-2 px-2 shadow-[0_-4px_10px_rgba(0,0,0,0.05)]">
                        <div className="max-w-md mx-auto flex justify-between items-center px-4 pb-2">
                            <button onClick={() => setActiveTab('budget')} className={`flex flex-col items-center p-2 w-16 transition-all ${activeTab === 'budget' ? 'text-blue-600 -translate-y-1' : 'text-gray-400'}`}>
                                <span className="text-2xl mb-1">💼</span>
                                <span className="text-[10px] font-bold">Budget</span>
                            </button>
                            
                            <button onClick={() => setActiveTab('courses')} className={`flex flex-col items-center p-2 w-16 transition-all relative ${activeTab === 'courses' ? 'text-blue-600 -translate-y-1' : 'text-gray-400'}`}>
                                {!isLogged && <span className="absolute top-1 right-2 text-[10px]">🔒</span>}
                                <span className="text-2xl mb-1">🛒</span>
                                <span className="text-[10px] font-bold">Courses</span>
                            </button>
                            
                            <button onClick={() => setActiveTab('plaisirs')} className={`flex flex-col items-center p-2 w-16 transition-all relative ${activeTab === 'plaisirs' ? 'text-blue-600 -translate-y-1' : 'text-gray-400'}`}>
                                {!isLogged && <span className="absolute top-1 right-2 text-[10px]">🔒</span>}
                                <span className="text-2xl mb-1">🍕</span>
                                <span className="text-[10px] font-bold">Plaisirs</span>
                            </button>
                            
                            <button onClick={() => setActiveTab('settings')} className={`flex flex-col items-center p-2 w-16 transition-all ${activeTab === 'settings' ? 'text-blue-600 -translate-y-1' : 'text-gray-400'}`}>
                                {!isLogged && <span className="absolute top-1 right-3 w-2 h-2 bg-red-500 rounded-full"></span>}
                                <span className="text-2xl mb-1">⚙️</span>
                                <span className="text-[10px] font-bold">Réglages</span>
                            </button>
                        </div>
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App/>);
    </script>
</body>
</html>
