<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmartBudget & Courses</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
        tailwind.config = { 
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        buddyDark: '#000000',
                        buddyCard: '#1C1C1E',
                        buddyGray: '#8E8E93',
                    },
                    animation: {
                        'pop': 'pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
                    },
                    keyframes: {
                        pop: {
                            '0%': { transform: 'scale(0.9)', opacity: '0' },
                            '100%': { transform: 'scale(1)', opacity: '1' },
                        }
                    }
                }
            } 
        }
    </script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-buddyDark dark:text-white transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Fonction pour la vibration
        const vibrate = (pattern = 50) => {
            if (navigator.vibrate) navigator.vibrate(pattern);
        };

        // --- COMPOSANT MASCOTTE RATON LAVEUR (SVG) ---
        const RaccoonMascot = ({ tab, className="w-12 h-12" }) => (
            <svg viewBox="0 0 100 100" className={className}>
                {/* Oreilles */}
                <polygon points="20,40 10,15 40,25" fill="#718096" />
                <polygon points="80,40 90,15 60,25" fill="#718096" />
                <polygon points="22,38 15,22 35,28" fill="#E2E8F0" />
                <polygon points="78,38 85,22 65,28" fill="#E2E8F0" />
                
                {/* Tête */}
                <ellipse cx="50" cy="55" rx="45" ry="35" fill="#A0AEC0" />
                
                {/* Masque de voleur (Raton) */}
                <path d="M 10 50 Q 50 70 90 50 Q 80 30 50 40 Q 20 30 10 50 Z" fill="#2D3748" />
                
                {/* Museau blanc et Nez */}
                <ellipse cx="50" cy="70" rx="20" ry="15" fill="#E2E8F0" />
                <ellipse cx="50" cy="68" rx="6" ry="4" fill="#1A202C" />
                
                {/* Yeux Bleus */}
                <circle cx="35" cy="48" r="9" fill="#FFFFFF" />
                <circle cx="35" cy="48" r="5" fill="#3B82F6" /> {/* Bleu */}
                <circle cx="33" cy="46" r="2" fill="#FFFFFF" /> {/* Reflet */}
                
                <circle cx="65" cy="48" r="9" fill="#FFFFFF" />
                <circle cx="65" cy="48" r="5" fill="#3B82F6" /> {/* Bleu */}
                <circle cx="63" cy="46" r="2" fill="#FFFFFF" /> {/* Reflet */}

                {/* Accessoires selon l'onglet */}
                {tab === 'budget' && <circle cx="80" cy="75" r="12" fill="#FBBF24" stroke="#D97706" strokeWidth="2" />}
                {tab === 'courses' && <path d="M 75 80 Q 80 60 85 80 Z" fill="#EF4444" /> /* Pomme simplifiée */}
                {tab === 'plaisirs' && <polygon points="70,70 90,75 80,90" fill="#F6E05E" stroke="#DD6B20" strokeWidth="2"/> /* Part de pizza */}
                {tab === 'settings' && <path d="M 20 45 L 80 45" stroke="#1A202C" strokeWidth="3" /> /* Lunettes trait */}
            </svg>
        );

        // --- COMPOSANT MODALE (Sorti de App pour éviter le bug du clavier) ---
        const Modal = ({ isOpen, onClose, title, children }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black/80 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 animate-pop">
                    <div className="bg-white dark:bg-buddyCard w-full sm:max-w-md rounded-t-[2rem] sm:rounded-[2rem] p-6 shadow-2xl">
                        <div className="flex justify-between items-center mb-6">
                            <h3 className="text-xl font-bold dark:text-white">{title}</h3>
                            <button onClick={() => { vibrate(30); onClose(); }} className="bg-gray-200 dark:bg-gray-700 w-8 h-8 rounded-full flex items-center justify-center font-bold text-gray-800 dark:text-white">✕</button>
                        </div>
                        {children}
                    </div>
                </div>
            );
        };

        function App() {
            // ÉTATS GLOBAUX
            const [isLogged, setIsLogged] = useState(false);
            const [activeTab, setActiveTab] = useState('budget');
            const [theme, setTheme] = useState('dark'); // Thème sombre par défaut !
            const [coords, setCoords] = useState(null);
            const [toast, setToast] = useState(null);

            // ÉTATS BUDGET
            const [categories, setCategories] = useState([]);
            
            // ÉTATS COURSES
            const [shoppingList, setShoppingList] = useState([]);
            const [selectedStore, setSelectedStore] = useState('Lidl');
            const [searchQuery, setSearchQuery] = useState('');

            // ÉTATS PLAISIRS (GPS)
            const [radius, setRadius] = useState(5); // en km

            // MODALES & FORMULAIRES
            const [showCatModal, setShowCatModal] = useState(false);
            const [showTransModal, setShowTransModal] = useState(false);
            const [newCat, setNewCat] = useState({ name: '', total: '', icon: '🍔', color: '#3B82F6' });
            const [newTrans, setNewTrans] = useState({ amount: '', catId: '', label: '' });

            // CATALOGUE SIMULÉ ÉTENDU
            const foodDatabase = [
                { id: 1, name: 'Lait demi-écrémé (6x1L)', nutri: 'A', prices: { Lidl: 5.40, Leclerc: 5.65, 'Super U': 5.95, Aldi: 5.35 } },
                { id: 2, name: 'Poulet rôti entier', nutri: 'B', prices: { Lidl: 6.50, Leclerc: 6.20, 'Super U': 7.10, Aldi: 6.45 } },
                { id: 3, name: 'Pâtes Coquillettes (500g)', nutri: 'A', prices: { Lidl: 0.89, Leclerc: 0.95, 'Super U': 1.15, Aldi: 0.85 } },
                { id: 4, name: 'Pizza Surgelée Royale', nutri: 'D', prices: { Lidl: 2.50, Leclerc: 2.80, 'Super U': 3.20, Aldi: 2.45 } },
                { id: 5, name: 'Oeufs Plein Air (x12)', nutri: 'A', prices: { Lidl: 2.99, Leclerc: 3.10, 'Super U': 3.40, Aldi: 2.95 } },
                { id: 6, name: 'Beurre Doux (250g)', nutri: 'E', prices: { Lidl: 2.10, Leclerc: 2.15, 'Super U': 2.45, Aldi: 2.05 } },
            ];

            // --- FONCTIONS UTILITAIRES ---
            const showToastMsg = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(null), 3000);
            };

            const geolocate = (callback) => {
                vibrate(50);
                if (navigator.geolocation) {
                    showToastMsg("Recherche GPS en cours...");
                    navigator.geolocation.getCurrentPosition(
                        (pos) => {
                            setCoords({ lat: pos.coords.latitude, lng: pos.coords.longitude });
                            showToastMsg("📍 Localisation trouvée !");
                            if (callback) callback(pos.coords.latitude, pos.coords.longitude);
                        },
                        (err) => showToastMsg("❌ Erreur GPS (Activez la localisation)")
                    );
                } else {
                    showToastMsg("Le GPS n'est pas supporté sur ce navigateur.");
                }
            };

            const openMapsForTakeout = () => {
                vibrate([30, 50]);
                if (coords) {
                    window.open(`https://www.google.com/maps/search/restaurant+à+emporter/@${coords.lat},${coords.lng},14z`, '_blank');
                } else {
                    window.open(`https://www.google.com/maps/search/restaurant+à+emporter+autour+de+moi`, '_blank');
                }
            };

            const openMapsForStore = (storeName) => {
                vibrate([30, 50]);
                if (coords) {
                    window.open(`https://www.google.com/maps/search/supermarché+${storeName}/@${coords.lat},${coords.lng},13z`, '_blank');
                } else {
                    window.open(`https://www.google.com/maps/search/supermarché+${storeName}+autour+de+moi`, '_blank');
                }
            };

            const autoSelectNearestStore = () => {
                geolocate((lat, lng) => {
                    // Simulation : On choisit un magasin au hasard pour montrer que l'action a eu lieu
                    const stores = ['Lidl', 'Leclerc', 'Super U', 'Aldi'];
                    const randomStore = stores[Math.floor(Math.random() * stores.length)];
                    setSelectedStore(randomStore);
                    showToastMsg(`🛒 ${randomStore} est le plus proche !`);
                });
            };

            // --- BUDGET LOGIC ---
            const addCategory = () => {
                if(!newCat.name || !newCat.total) return;
                vibrate(50);
                setCategories([...categories, { ...newCat, id: Date.now(), total: parseFloat(newCat.total), spent: 0 }]);
                setShowCatModal(false);
                setNewCat({ name: '', total: '', icon: '🍔', color: '#3B82F6' });
            };

            const addTransaction = () => {
                if(!newTrans.amount || !newTrans.catId) return;
                vibrate([50, 100]);
                const updated = categories.map(cat => {
                    if(cat.id === parseInt(newTrans.catId)) {
                        return { ...cat, spent: cat.spent + parseFloat(newTrans.amount) };
                    }
                    return cat;
                });
                setCategories(updated);
                setShowTransModal(false);
                setNewTrans({ amount: '', catId: '', label: '' });
            };

            const totalBudget = categories.reduce((sum, cat) => sum + cat.total, 0);
            const totalSpent = categories.reduce((sum, cat) => sum + cat.spent, 0);
            
            // Calcul pour le graphique Donut (SVG Circle)
            const radiusCircle = 70;
            const circumference = 2 * Math.PI * radiusCircle;
            const spendPercentage = totalBudget > 0 ? Math.min(totalSpent / totalBudget, 1) : 0;
            const strokeDashoffset = circumference - (spendPercentage * circumference);

            return (
                <div className={`min-h-screen pb-24 ${theme === 'dark' ? 'dark' : ''}`}>
                    {toast && (
                        <div className="fixed top-16 left-1/2 transform -translate-x-1/2 bg-blue-600 text-white px-6 py-3 rounded-full shadow-2xl z-50 animate-pop font-bold whitespace-nowrap">
                            {toast}
                        </div>
                    )}

                    {/* HEADER */}
                    <header className="bg-white/90 dark:bg-buddyDark/90 backdrop-blur-xl p-4 sticky top-0 z-10 border-b dark:border-gray-800">
                        <div className="max-w-4xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <RaccoonMascot tab={activeTab} className="w-10 h-10" />
                                <h1 className="text-xl font-extrabold tracking-tight dark:text-white">Smart<span className="text-blue-500">Budget</span></h1>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-4xl mx-auto p-4 mt-2">
                        
                        {/* ONGLET BUDGET */}
                        {activeTab === 'budget' && (
                            <div className="space-y-6 animate-pop">
                                
                                {/* Graphique Donut (Style Buddy) */}
                                <div className="bg-white dark:bg-buddyCard rounded-[2rem] p-6 shadow-sm flex flex-col items-center relative overflow-hidden">
                                    <h2 className="text-gray-500 dark:text-buddyGray font-bold uppercase text-xs tracking-widest mb-6">Reste à dépenser</h2>
                                    
                                    <div className="relative w-48 h-48 flex items-center justify-center">
                                        {/* Cercle de fond */}
                                        <svg className="absolute inset-0 w-full h-full transform -rotate-90">
                                            <circle cx="96" cy="96" r="70" fill="transparent" stroke={theme === 'dark' ? '#333' : '#E5E7EB'} strokeWidth="16" />
                                            {/* Cercle de progression */}
                                            <circle 
                                                cx="96" cy="96" r="70" 
                                                fill="transparent" 
                                                stroke="#3B82F6" 
                                                strokeWidth="16" 
                                                strokeLinecap="round"
                                                strokeDasharray={circumference}
                                                strokeDashoffset={strokeDashoffset}
                                                className="transition-all duration-1000 ease-out"
                                            />
                                        </svg>
                                        <div className="text-center z-10">
                                            <p className="text-3xl font-black dark:text-white">{(totalBudget - totalSpent).toFixed(2)}€</p>
                                        </div>
                                    </div>

                                    <p className="text-sm font-bold text-gray-400 mt-4">{totalSpent.toFixed(2)}€ dépensés / {totalBudget.toFixed(2)}€</p>

                                    <div className="flex w-full gap-3 mt-6">
                                        <button onClick={() => setShowTransModal(true)} className="flex-1 bg-gray-900 dark:bg-white text-white dark:text-gray-900 font-bold py-4 rounded-2xl active:scale-95 transition-all">➖ Dépense</button>
                                        <button onClick={() => setShowCatModal(true)} className="flex-1 bg-blue-100 text-blue-700 dark:bg-[#2C2C2E] dark:text-blue-400 font-bold py-4 rounded-2xl active:scale-95 transition-all">➕ Catégorie</button>
                                    </div>
                                </div>

                                {/* Liste des Catégories */}
                                <div className="space-y-4">
                                    {categories.map(cat => (
                                        <div key={cat.id} className="bg-white dark:bg-buddyCard p-5 rounded-[2rem] shadow-sm flex flex-col gap-3">
                                            <div className="flex justify-between items-center">
                                                <div className="flex items-center gap-4">
                                                    <div className="w-12 h-12 rounded-full flex items-center justify-center text-xl text-white" style={{backgroundColor: cat.color}}>
                                                        {cat.icon}
                                                    </div>
                                                    <div>
                                                        <p className="font-bold text-lg dark:text-white">{cat.name}</p>
                                                        <p className="text-xs font-medium text-gray-500">{(cat.total - cat.spent).toFixed(2)}€ restants</p>
                                                    </div>
                                                </div>
                                                <p className="font-extrabold text-xl dark:text-white">{cat.spent.toFixed(2)}€</p>
                                            </div>
                                            <div className="w-full bg-gray-100 dark:bg-gray-800 h-2 rounded-full overflow-hidden">
                                                <div className="h-full rounded-full transition-all duration-500" style={{backgroundColor: cat.color, width: `${Math.min((cat.spent/cat.total)*100, 100)}%`}}></div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* ONGLET COURSES */}
                        {activeTab === 'courses' && (
                            !isLogged ? <div className="text-center py-20"><p>Créez un compte dans Réglages</p></div> : (
                            <div className="space-y-6 animate-pop">
                                
                                <div className="bg-white dark:bg-buddyCard p-6 rounded-[2rem] shadow-sm">
                                    <h2 className="text-xl font-bold mb-4 dark:text-white flex items-center gap-2">🛒 Catalogue & Liste</h2>
                                    
                                    {/* Localisation Auto */}
                                    <button onClick={autoSelectNearestStore} className="w-full mb-4 bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 font-bold py-3 rounded-xl flex items-center justify-center gap-2 active:scale-95 transition-all">
                                        📍 Trouver le supermarché le plus proche
                                    </button>

                                    {/* Sélecteur de magasins */}
                                    <div className="flex gap-2 overflow-x-auto pb-2 hide-scrollbar">
                                        {['Lidl', 'Leclerc', 'Super U', 'Aldi'].map(store => (
                                            <button key={store} onClick={() => { vibrate(30); setSelectedStore(store); }} 
                                                className={`px-5 py-2.5 rounded-full font-bold whitespace-nowrap transition-all ${selectedStore === store ? 'bg-blue-600 text-white' : 'bg-gray-100 dark:bg-gray-800 text-gray-500'}`}>
                                                {store}
                                            </button>
                                        ))}
                                    </div>

                                    {/* Recherche */}
                                    <input type="text" placeholder={`Rechercher chez ${selectedStore}...`} value={searchQuery} onChange={e=>setSearchQuery(e.target.value)} 
                                        className="w-full mt-4 p-4 rounded-xl bg-gray-50 dark:bg-gray-800 outline-none font-medium dark:text-white" />

                                    {/* Résultats simulés */}
                                    {searchQuery && (
                                        <div className="mt-2 border dark:border-gray-700 rounded-xl overflow-hidden">
                                            {foodDatabase.filter(f => f.name.toLowerCase().includes(searchQuery.toLowerCase())).map(food => (
                                                <div key={food.id} className="flex justify-between items-center p-3 border-b dark:border-gray-700 bg-white dark:bg-buddyCard last:border-0">
                                                    <div>
                                                        <span className="font-bold text-sm dark:text-white">{food.name}</span>
                                                        <span className="ml-2 text-xs font-bold text-gray-400">({food.prices[selectedStore]}€)</span>
                                                    </div>
                                                    <button onClick={() => { vibrate(30); setShoppingList([...shoppingList, food]); setSearchQuery(''); showToastMsg("Ajouté !"); }} 
                                                        className="bg-gray-900 dark:bg-white text-white dark:text-gray-900 px-3 py-1.5 rounded-lg font-bold text-sm">Ajouter</button>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>

                                {/* Mon Panier */}
                                {shoppingList.length > 0 && (
                                    <div className="bg-white dark:bg-buddyCard p-6 rounded-[2rem] shadow-sm">
                                        <div className="flex justify-between items-end mb-4">
                                            <h3 className="font-bold dark:text-white">Ma Liste</h3>
                                            <p className="text-2xl font-black text-blue-600 dark:text-blue-400">
                                                {shoppingList.reduce((sum, item) => sum + item.prices[selectedStore], 0).toFixed(2)} €
                                            </p>
                                        </div>
                                        {shoppingList.map((item, idx) => (
                                            <div key={idx} className="flex justify-between py-2 border-b dark:border-gray-700 last:border-0">
                                                <span className="dark:text-white font-medium">{item.name}</span>
                                                <span className="text-gray-500 font-bold">{item.prices[selectedStore].toFixed(2)}€</span>
                                            </div>
                                        ))}
                                        <button onClick={() => openMapsForStore(selectedStore)} className="w-full mt-6 bg-green-600 text-white font-bold py-4 rounded-xl active:scale-95 transition-all">
                                            🚘 Naviguer vers {selectedStore}
                                        </button>
                                    </div>
                                )}
                            </div>
                            )
                        )}

                        {/* ONGLET PLAISIRS */}
                        {activeTab === 'plaisirs' && (
                            !isLogged ? <div className="text-center py-20"><p>Créez un compte dans Réglages</p></div> : (
                            <div className="space-y-6 animate-pop">
                                <div className="bg-white dark:bg-buddyCard rounded-[2rem] p-6 shadow-sm">
                                    <h2 className="text-2xl font-extrabold mb-2 dark:text-white flex items-center gap-2">🍕 Restos À Emporter</h2>
                                    <p className="text-gray-500 dark:text-buddyGray font-medium mb-6">Trouvez de quoi vous faire plaisir autour de vous.</p>

                                    <div className="space-y-6">
                                        {/* GPS Auto */}
                                        <button onClick={() => geolocate()} className="w-full bg-gray-100 dark:bg-gray-800 text-gray-800 dark:text-white font-bold py-4 rounded-2xl flex items-center justify-center gap-2 active:scale-95 transition-all">
                                            {coords ? "✅ Position GPS acquise" : "📍 Localiser mon appareil"}
                                        </button>

                                        {/* Curseur Rayon */}
                                        <div>
                                            <div className="flex justify-between font-bold text-sm mb-2 dark:text-white">
                                                <span>Rayon de recherche</span>
                                                <span className="text-blue-500">{radius} km</span>
                                            </div>
                                            <input type="range" min="1" max="20" value={radius} onChange={(e) => setRadius(e.target.value)} className="w-full accent-blue-600" />
                                        </div>

                                        {/* Action Google Maps */}
                                        <button onClick={openMapsForTakeout} className="w-full bg-blue-600 text-white font-black py-4 rounded-2xl shadow-lg active:scale-95 transition-all">
                                            🔍 Voir les Fast-Foods à emporter
                                        </button>
                                        <p className="text-center text-xs text-gray-500">Ouvre directement Google Maps avec le filtre "À emporter".</p>
                                    </div>
                                </div>
                            </div>
                            )
                        )}

                        {/* ONGLET REGLAGES */}
                        {activeTab === 'settings' && (
                            <div className="space-y-6 animate-pop">
                                {!isLogged ? (
                                    <div className="bg-white dark:bg-buddyCard p-8 rounded-[2rem] text-center">
                                        <RaccoonMascot tab="settings" className="w-24 h-24 mx-auto mb-4" />
                                        <h2 className="text-2xl font-black mb-6 dark:text-white">Créer mon espace</h2>
                                        <button onClick={() => { vibrate([50,50]); setIsLogged(true); setActiveTab('budget'); }} className="w-full bg-blue-600 text-white p-4 rounded-2xl font-bold active:scale-95 transition-all">
                                            Démarrer sans inscription
                                        </button>
                                    </div>
                                ) : (
                                    <div className="space-y-4">
                                        <div className="bg-white dark:bg-buddyCard p-6 rounded-[2rem] flex justify-between items-center">
                                            <span className="font-bold dark:text-white">Mode Sombre (Buddy)</span>
                                            <button onClick={() => { vibrate(30); setTheme(theme === 'light' ? 'dark' : 'light'); }} 
                                                className={`w-14 h-8 rounded-full p-1 transition-colors ${theme === 'dark' ? 'bg-blue-600' : 'bg-gray-300'}`}>
                                                <div className={`w-6 h-6 bg-white rounded-full transition-transform ${theme === 'dark' ? 'translate-x-6' : ''}`}></div>
                                            </button>
                                        </div>
                                        <button onClick={() => setIsLogged(false)} className="w-full bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 font-bold p-4 rounded-[2rem]">
                                            Réinitialiser l'application
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}

                    </main>

                    {/* NAVBAR BAS */}
                    <nav className="bg-white/90 dark:bg-buddyCard/90 backdrop-blur-xl border-t dark:border-gray-800 fixed bottom-0 w-full pb-safe pt-2 px-2 z-40">
                        <div className="max-w-md mx-auto flex justify-between items-center px-6 pb-4">
                            {[
                                { id: 'budget', icon: '💼', label: 'Budget' },
                                { id: 'courses', icon: '🛒', label: 'Courses' },
                                { id: 'plaisirs', icon: '🍕', label: 'Plaisirs' },
                                { id: 'settings', icon: '⚙️', label: 'Réglages' }
                            ].map(item => (
                                <button key={item.id} onClick={() => { vibrate(30); setActiveTab(item.id); }} 
                                    className={`flex flex-col items-center p-2 transition-all duration-300 ${activeTab === item.id ? 'text-blue-600 -translate-y-2' : 'text-gray-400 dark:text-buddyGray'}`}>
                                    <span className="text-2xl mb-1">{item.icon}</span>
                                    <span className="text-[10px] font-extrabold">{item.label}</span>
                                    {activeTab === item.id && <div className="absolute -bottom-2 w-1.5 h-1.5 bg-blue-600 rounded-full"></div>}
                                </button>
                            ))}
                        </div>
                    </nav>

                    {/* MODALES INSÉRÉES ICI */}
                    <Modal isOpen={showCatModal} onClose={() => setShowCatModal(false)} title="Nouvelle Catégorie">
                        <div className="space-y-4">
                            <input type="text" placeholder="Nom (ex: Loyer)" value={newCat.name} onChange={e=>setNewCat({...newCat, name: e.target.value})} className="w-full p-4 bg-gray-50 dark:bg-[#2C2C2E] dark:text-white rounded-xl outline-none font-bold" />
                            <input type="number" placeholder="Budget (€)" value={newCat.total} onChange={e=>setNewCat({...newCat, total: e.target.value})} className="w-full p-4 bg-gray-50 dark:bg-[#2C2C2E] dark:text-white rounded-xl outline-none font-bold" />
                            <div className="flex gap-2 pt-2">
                                {['#3B82F6', '#EF4444', '#10B981', '#F59E0B', '#8B5CF6'].map(color => (
                                    <button key={color} onClick={()=>setNewCat({...newCat, color})} style={{backgroundColor: color}} className={`w-10 h-10 rounded-full transition-all ${newCat.color === color ? 'ring-4 ring-offset-2 ring-gray-800 scale-110' : ''}`}></button>
                                ))}
                            </div>
                            <button onClick={addCategory} className="w-full bg-blue-600 text-white font-bold py-4 rounded-xl mt-4 active:scale-95 transition-all">Créer</button>
                        </div>
                    </Modal>

                    <Modal isOpen={showTransModal} onClose={() => setShowTransModal(false)} title="Ajouter une Dépense">
                        <div className="space-y-4">
                            {categories.length === 0 ? <p className="text-red-500 font-bold text-center">Créez une catégorie d'abord !</p> : (
                                <>
                                    <div className="text-center pb-4">
                                        <input type="number" placeholder="0.00" value={newTrans.amount} onChange={e=>setNewTrans({...newTrans, amount: e.target.value})} className="w-full text-center text-5xl font-black bg-transparent outline-none text-gray-900 dark:text-white" autoFocus />
                                    </div>
                                    <select value={newTrans.catId} onChange={e=>setNewTrans({...newTrans, catId: e.target.value})} className="w-full p-4 bg-gray-50 dark:bg-[#2C2C2E] dark:text-white rounded-xl outline-none font-bold">
                                        <option value="" disabled>Choisir la catégorie...</option>
                                        {categories.map(cat => <option key={cat.id} value={cat.id}>{cat.name}</option>)}
                                    </select>
                                    <button onClick={addTransaction} className="w-full bg-gray-900 dark:bg-white text-white dark:text-gray-900 font-bold py-4 rounded-xl mt-4 active:scale-95 transition-all">Valider</button>
                                </>
                            )}
                        </div>
                    </Modal>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App/>);
    </script>
</body>
</html>
